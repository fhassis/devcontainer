# Build and publish the devcontainer base image to the GitLab Container Registry.
# On a git tag -> image tag = the tag name; otherwise (default branch) -> :latest.
stages:
  - build

build:
  stage: build
  image: docker:29-cli
  services:
    - docker:29-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        IMAGE="$CI_REGISTRY_IMAGE:latest"
      fi
      docker build -t "$IMAGE" src
      docker push "$IMAGE"
  rules:
    # A git tag always (re)publishes the named image.
    - if: $CI_COMMIT_TAG
    # On the default branch, only when the build context changes — everything that
    # affects the image lives in src/, so README/docs-only commits skip the build.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - src/**/*
