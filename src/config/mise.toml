# Development toolchains. scripts/install-tools.sh copies this to
# ~/.config/mise/conf.d/dev.toml and installs it into ~/.local/share/mise. mise
# merges it with ~/.config/mise/config.toml (terminal tools, from dotfiles) and
# a project's mise.toml, which can pin other versions.
[tools]
# pinned; a rebuild takes the latest patch of each
python = "3.15"
node = "26"
postgres = "18"   # psql, pg_dump...: match the server's major
kubectl = "1.37"  # match the cluster
# rolling
uv = "latest"
helm = "latest"
gh = "latest"
# language servers for the Claude Code LSP plugins
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:pyright" = "latest"

[settings]
# projects that pin node with .nvmrc / .node-version
idiomatic_version_file_enable_tools = ["node"]
